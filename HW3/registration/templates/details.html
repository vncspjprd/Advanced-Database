<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            background-color: #e3f2fd;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <h2 class="mb-4 text-center">Registration Details</h2>
            <div class="card p-4">
                <div class="mb-3">
                    <label class="form-label"><strong>Lastname:</strong></label>
                    <input type="text" class="form-control" value="{{ lastname }}" readonly>
                </div>
                <div class="mb-3">
                    <label class="form-label"><strong>Firstname:</strong></label>
                    <input type="text" class="form-control" value="{{ firstname }}" readonly>
                </div>
                <div class="mb-3">
                    <label class="form-label"><strong>Sex:</strong></label>
                    <input type="text" class="form-control" value="{{ sex }}" readonly>
                </div>
                <div class="mb-3">
                    <label class="form-label"><strong>Institution:</strong></label>
                    <input type="text" class="form-control" value="{{ institution }}" readonly>
                </div>
                <div class="mb-3">
                    <label class="form-label"><strong>Email:</strong></label>
                    <input type="text" class="form-control" value="{{ email }}" readonly>
                </div>
                <div class="d-flex justify-content-center mt-3">
                    <a href="/" class="btn btn-secondary px-5">Back to Registration</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
